name: Release macOS

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Use a stable version tag such as v0.1.4.' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo 'Tag a commit that has already been merged into main.' >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          bundle_version=$(python3 -c 'import plistlib; print(plistlib.load(open("UsageNotch/Info.plist", "rb"))["CFBundleShortVersionString"])')
          if [[ "$bundle_version" != "$version" ]]; then
            echo "The app version ($bundle_version) does not match the tag ($version)." >&2
            exit 1
          fi

          release=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" |
            jq -c --arg tag "$GITHUB_REF_NAME" 'first(.[][] | select(.tag_name == $tag and (.draft | not))) // null')
          if [[ "$release" != null ]]; then
            if jq -e --arg zip "On-pace-$version-macOS.zip" \
              '(.prerelease | not) and any(.assets[]; .name == $zip and .state == "uploaded")' <<< "$release" >/dev/null; then
              echo "$GITHUB_REF_NAME already has a stable release with the macOS ZIP."
              exit 0
            fi
            echo "$GITHUB_REF_NAME already has a published release that needs manual attention." >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Sign, notarize, and publish
    needs: validate
    if: ${{ needs.validate.outputs.version != '' }}
    runs-on: macos-26
    timeout-minutes: 60
    environment: macos-release
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Release
        run: bash Scripts/BuildMacOS.sh "$RUNNER_TEMP/on-pace-derived-data"
      - name: Sign and notarize the app
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          bash Scripts/SignMacOSRelease.sh \
            "$RUNNER_TEMP/on-pace-derived-data/Build/Products/Release/On pace..app" \
            "$RUNNER_TEMP/On-pace-$RELEASE_VERSION-macOS.zip" \
            "$RELEASE_VERSION"
      - name: Publish the macOS ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/On-pace-$RELEASE_VERSION-macOS.zip"
          tag_commit=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME^{}" |
            sort -k2 | tail -n 1 | cut -f1)
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo 'The remote tag no longer points to the commit that was built.' >&2
            exit 1
          fi
          release=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" |
            jq -c --arg tag "$GITHUB_REF_NAME" 'first(.[][] | select(.tag_name == $tag)) // null')
          if [[ "$release" == null ]]; then
            gh release create "$GITHUB_REF_NAME" "$zip" --verify-tag --latest \
              --title "On pace. $RELEASE_VERSION" --generate-notes
          elif jq -e '.draft' <<< "$release" >/dev/null; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
          else
            echo "$GITHUB_REF_NAME was published during this run. Check the existing release." >&2
            exit 1
          fi
