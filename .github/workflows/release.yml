name: Release macOS

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Use a stable version tag such as v0.1.4.' >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo 'Tag a commit that has already been merged into main.' >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          bundle_version=$(python3 -c 'import plistlib; print(plistlib.load(open("UsageNotch/Info.plist", "rb"))["CFBundleShortVersionString"])')
          if [[ "$bundle_version" != "$version" ]]; then
            echo "The app version ($bundle_version) does not match the tag ($version)." >&2
            exit 1
          fi

          release=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" |
            jq -c --arg tag "$GITHUB_REF_NAME" 'first(.[][] | select(.tag_name == $tag and (.draft | not))) // null')
          if [[ "$release" != null ]]; then
            if jq -e --arg zip "On-pace-$version-macOS.zip" \
              '.assets as $assets | (.prerelease | not) and
                all([$zip, "appcast.xml"][]; . as $name | any($assets[]; .name == $name and .state == "uploaded"))' \
              <<< "$release" >/dev/null; then
              echo "$GITHUB_REF_NAME already has a stable release with the macOS ZIP and appcast."
              exit 0
            fi
            echo "$GITHUB_REF_NAME already has a published release that needs manual attention." >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Sign, notarize, and publish
    needs: validate
    if: ${{ needs.validate.outputs.version != '' }}
    runs-on: macos-26-intel
    timeout-minutes: 60
    environment: macos-release
    concurrency:
      group: macos-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Release
        run: bash Scripts/BuildMacOS.sh "$RUNNER_TEMP/on-pace-derived-data"
      - name: Sign and notarize the app
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/on-pace-release"
          bash Scripts/SignMacOSRelease.sh \
            "$RUNNER_TEMP/on-pace-derived-data/Build/Products/Release/On pace..app" \
            "$RUNNER_TEMP/on-pace-release/On-pace-$RELEASE_VERSION-macOS.zip" \
            "$RELEASE_VERSION"
      - name: Generate the signed update feed
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/on-pace-release"
          latest=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 \
            --json isLatest,tagName --jq 'map(select(.isLatest))[0].tagName // ""')
          if [[ -n "$latest" ]]; then
            python3 - "$latest" "$GITHUB_REF_NAME" <<'PY'
          import sys

          latest, candidate = sys.argv[1:]
          def version(tag):
              return tuple(map(int, tag.removeprefix("v").split(".")))

          if version(latest) >= version(candidate):
              sys.exit(f"Publish a version newer than the latest stable release ({latest}).")
          PY
            prior_assets=$(gh release view "$latest" --json assets)
            if jq -e 'any(.assets[]; .name == "appcast.xml")' <<< "$prior_assets" >/dev/null; then
              gh release download "$latest" --pattern appcast.xml --dir "$assets"
            fi
          fi

          derived="$RUNNER_TEMP/on-pace-derived-data"
          bash Scripts/GenerateAppcast.sh "$derived/Build/Products/Release/On pace..app" \
            "$assets/On-pace-$RELEASE_VERSION-macOS.zip" \
            "$derived/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"
      - name: Publish the macOS ZIP and appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/on-pace-release"
          tag_commit=$(git ls-remote origin "refs/tags/$GITHUB_REF_NAME" "refs/tags/$GITHUB_REF_NAME^{}" |
            sort -k2 | tail -n 1 | cut -f1)
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo 'The remote tag no longer points to the commit that was built.' >&2
            exit 1
          fi
          release=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" |
            jq -c --arg tag "$GITHUB_REF_NAME" 'first(.[][] | select(.tag_name == $tag)) // null')
          if [[ "$release" == null ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "On pace. $RELEASE_VERSION" --generate-notes
          elif ! jq -e '.draft' <<< "$release" >/dev/null; then
            echo "$GITHUB_REF_NAME was published during this run. Check the existing release." >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            "$assets/On-pace-$RELEASE_VERSION-macOS.zip" "$assets/appcast.xml"
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease=false --latest
