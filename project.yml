name: UsageNotch
options:
  deploymentTarget:
    macOS: "14.0"
targets:
  UsageNotch:
    type: application
    platform: macOS
    sources:
      - UsageNotch
    info:
      path: UsageNotch/Info.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSPrefersDisplaySafeAreaCompatibilityMode: false
        CFBundleDisplayName: "On pace."
        CFBundleShortVersionString: "0.1.4"
        CFBundleVersion: "5"
    settings:
      base:
        PRODUCT_NAME: "On pace."
        PRODUCT_MODULE_NAME: UsageNotch
        PRODUCT_BUNDLE_IDENTIFIER: be.kodeus.UsageNotch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
schemes:
  UsageNotch:
    build:
      targets:
        UsageNotch: all
